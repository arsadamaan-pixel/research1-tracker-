<!doctype html>
<html lang="si"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Research1 · Task Tracker</title>
<style>
:root{--ink:#18251f;--muted:#66736c;--line:#e1e8e3;--green:#176b4b;--pale:#edf6f0;--paper:#f6f8f5;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Noto Sans Sinhala",sans-serif}header{background:#123c30;color:white;padding:30px max(22px,calc((100vw - 1000px)/2)) 26px}header h1{font-size:clamp(24px,4vw,34px);margin:0 0 4px}header p{margin:0;color:#c8ddd1}main{max-width:1000px;margin:24px auto;padding:0 20px}.progress{background:white;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:18px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.count{font-weight:700;color:var(--green)}.bar{height:9px;background:#e8eee9;border-radius:9px;margin-top:12px;overflow:hidden}.fill{height:100%;background:#318461;width:0;transition:width .2s}.phase{margin:24px 0 10px;display:flex;align-items:baseline;gap:10px}.phase h2{font-size:19px;margin:0}.phase small{color:var(--muted)}.card{background:white;border:1px solid var(--line);border-radius:12px;margin:9px 0;overflow:hidden}.head{display:flex;align-items:center;gap:13px;padding:15px 17px;cursor:pointer}.check{width:23px;height:23px;accent-color:var(--green);flex:none}.title{font-weight:680;flex:1}.mark{font-size:12px;color:var(--green);background:var(--pale);padding:3px 9px;border-radius:20px}.detail{border-top:1px solid var(--line);padding:15px 18px 18px 54px;color:#34443b}.detail ul{padding-left:20px;margin:5px 0 15px}.detail li{margin:5px 0}.detail h3{font-size:14px;margin:13px 0 6px}.log{display:grid;grid-template-columns:1fr 1fr;gap:8px}.log textarea{border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit;min-height:68px;resize:vertical}.log button,.clear{border:0;border-radius:8px;background:var(--green);color:white;padding:9px 13px;font:inherit;cursor:pointer}.saved{font-size:13px;color:var(--green);align-self:center}.hint{font-size:13px;color:var(--muted);margin:16px 2px}footer{color:var(--muted);font-size:13px;margin:26px 0}.next{color:var(--green);font-weight:650}.hidden{display:none}@media(max-width:600px){.head{padding:13px}.detail{padding:13px 14px}.log{grid-template-columns:1fr}.mark{font-size:11px}}
</style>
<header><h1>Research1 · මගේ Research වැඩසටහන</h1><p>එක් වැඩක් බැගින් සම්පූර්ණ කරලා tick කරන්න. ඔබේ සටහන් මේ browser එකේම සුරැකේ.</p></header>
<main><section class="progress"><div class="row"><strong>සමස්ත ප්‍රගතිය</strong><span class="count" id="count">0 / 12</span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="next" id="next"></div></section><div id="tasks"></div><button class="clear" id="clear">සියලු tick සහ සටහන් මකන්න</button><p class="hint">ඔබේ progress එක මෙම browser එකේ local storage තුළ තබා ඇත. Browser data මැකුවහොත් සටහන් නැති වෙයි.</p><footer>Proposal 20% · Midpoint 20% · Final Dissertation 60%</footer></main>
<script>
const phases=[{name:"Proposal",weight:"20%",tasks:[
["1","මාතෘකාව සහ පර්යේෂණ ගැටලුව තෝරන්න","MSc Computer Science සඳහා ගැළපෙන මාතෘකාවක් තෝරන්න. ගැටලුව කාටද බලපාන්නේ, විසඳී නැත්තේ කුමක්ද, එය වැදගත් ඇයිද කියා එක වාක්‍යයකින් ලියන්න. උපදේශකයා සමඟ සාකච්ඡා කරන්න.","proposal","Танилцуулга: 200 үг · 10%; Хавтас/формат: 5%. Гарчиг 10–15 үг."],
["2","Судалгааны өгүүллүүд уншаад gap олох","Холбогдох papers хай. Paper бүрээс хийсэн ажил, өгөгдөл/арга, үр дүн, хязгаарлалтыг тэмдэглэ. Харьцуулж шийдэгдээгүй gap-ийг нотолгоотой тодорхойл. Боломжтой dataset шалга.","proposal","පසුබිම: 500–600 үг · 25%."],
["3","පර්යේෂණ ප්‍රශ්නය, අරමුණ, අරමුණු бичих","Question нь хайх хариуг, Aim нь гол зорилгыг хэлнэ. Хэмжиж болох objectives жагсаа. Scope-д хамрах хүрээг, limitations-д бодит хязгаарлалтаа бич.","proposal","Question 5%, Aim 5%, Objectives 10%."],
["4","Proposal дуусгаж өгөх","Арга, өгөгдөл/tools, deliverables, сорилт, нөөц, timeline, ethics, дүгнэлт, references бич. Supervisor feedback-аар засаж submit хийнэ.","proposal","Нийт дээд хэмжээ 1,500 үг. Deliverables 10%, Challenge 5%, Plan 10%, Resources 5%, References 10%."]
]},{name:"Ethics ба Midpoint",weight:"20%",tasks:[
["5","Ethics маягт бөглөж зөвшөөрөл авах","Supervisor-той ярьж Disclaimer, Proportionate эсвэл Full Review тохирохыг сонго. Оролцогчтой survey/interview/testing хийх бол зөвшөөрөл хүлээнэ.","mid","Маягтад тусгай оноо заагаагүй."],
["6","Midpoint тайлангийн үндсэн хэсгүүд бичих","Introduction, literature review, gap, methodology бич. Арга ба анализын сонголтоо тайлбарлаж citation/reference-ээ шалга.","mid","Introduction 500–800 үг/10%; අදාළ පර්යේෂණ 3,500–4,000 үг/30%; Gap 300–500 үг/15%."],
["7","Ахиц харуулж Midpoint өгөх","Software бол prototype/design харуул. Судалгааны дата бол эх үүсвэр, асуулга эсвэл анализын бэлтгэлээ харуул. Хийсэн ажил, асуудал, цаашдын төлөвлөгөө бич. Cover sheet, problem ба methodology агуулсан богино abstract нэм.","mid","Ахиц 300–500 үг/15%; Ирээдүйн төлөвлөгөө 300–500 үг/10%; Supervisor review 20%."]
]},{name:"Research ба Final Dissertation",weight:"60%",tasks:[
["8","System эсвэл судалгаагаа design хийх","Software бол requirements, system design, test plan боловсруул. Data study бол эх үүсвэр/sample, collection instrument, analysis plan бич. Objective бүрийг хэмжих шалгууртай холбо.","final","Design 1,500 үг/15%."],
["9","Судалгаагаа хийж үр дүнг үнэлэх","Software бүтээж tests ажиллуул, эсвэл дата цуглуулж анализ хий. Арга, үр дүн, алдаа засвар, evidence хадгал. Objective бүр болон research question-д хариулсан эсэхийг үнэл.","final","ක්‍රියාත්මක කිරීම/පරීක්ෂා කිරීම/විශ්ලේෂණය 1,500 үг/20%; විවේචනාත්මක ඇගයීම 1,500 үг/5%."],
["10","Final Dissertation бичих","Midpoint хэсгүүдээ сайжруул. Problem analysis, design, implementation/analysis, evaluation, conclusion, future work бич. Abstract-аа үр дүн бэлэн болсны дараа дуусга.","final","Abstract 200–300/5%; Intro 1,000/5%; Literature review 4,500–5,000/20%; Problem analysis 500–1,000/10%; Methods 1,000/10%; Conclusion 700/5%."],
["11","Эцсийн файлаа шалгаж submit хийх","Зөв template ашигла. Title page, contents, figures/tables, references шалга. Supervisor approval page болон дугаарласан meeting logs appendix-д нэм. Submit receipt хадгал.","final","Бүтэц ба references 5%."],
["12","Presentation / Demo бэлтгэх","Problem → gap → method → results → conclusion дарааллаар тайлбарла. Demo турш. Сонгосон арга, нотолгоо, limitations-ын асуултад бэлд.","final","Presentation/demo 20%; Аргумент 40%; Q&A 40%. Rubric-ийн module оноонд эзлэх байдал тодорхойгүй."]
]}];
const key="research1-tracker-v1";let state={};try{state=JSON.parse(localStorage.getItem(key)||"{}")}catch{};const host=document.getElementById("tasks");
for(const ph of phases){let section=document.createElement("section");section.innerHTML='<div class="phase"><h2>'+ph.name+'</h2><small>Нийт үнэлгээний '+ph.weight+'</small></div>';for(const [n,title,desc,stage,marks] of ph.tasks){let card=document.createElement("article");card.className="card";let k="t"+n;let d=state[k]||{};card.innerHTML='<label class="head"><input class="check" type="checkbox" '+(d.done?'checked':'')+'><span class="title">Task '+n+' · '+title+'</span><span class="mark">'+marks.split(/[;·]/)[0]+'</span></label><div class="detail hidden"><div>'+desc+'</div><h3>Ажлын log</h3><div class="log"><textarea placeholder="Өнөөдөр хийсэн ажил" data-field="work"></textarea><textarea placeholder="Дараагийн хийх зүйл / асуудал" data-field="next"></textarea><textarea placeholder="Нотолгоо: файл, paper, screenshot"></textarea><span class="saved"></span></div><p><strong>Оноо ба шаардлага:</strong> '+marks+'</p></div>';let head=card.querySelector(".head");head.addEventListener("click",e=>{if(e.target.type!=="checkbox")card.querySelector(".detail").classList.toggle("hidden")});let inputs=card.querySelectorAll("textarea");inputs[0].value=d.work||"";inputs[1].value=d.next||"";inputs[2].value=d.evidence||"";inputs.forEach((el,i)=>el.addEventListener("input",()=>{let x=state[k]||{};x[["work","next","evidence"][i]]=el.value;state[k]=x;localStorage.setItem(key,JSON.stringify(state));card.querySelector(".saved").textContent="Хадгаллаа"}));card.querySelector("input").addEventListener("change",e=>{let x=state[k]||{};x.done=e.target.checked;state[k]=x;localStorage.setItem(key,JSON.stringify(state));update()});section.append(card)}host.append(section)}
function update(){let n=phases.flatMap(x=>x.tasks).filter(([n])=>state["t"+n]?.done).length;document.getElementById("count").textContent=n+" / 12";document.getElementById("fill").style.width=(n/12*100)+"%";let todo=phases.flatMap(x=>x.tasks).find(([i])=>!state["t"+i]?.done);document.getElementById("next").textContent=todo?"Дараагийнх: Task "+todo[0]+" · "+todo[1]:"Бүх task дууссан байна 🎉"}update();document.getElementById("clear").onclick=()=>{if(confirm("Бүх тэмдэглэгээ, log-ийг устгах уу?")){localStorage.removeItem(key);location.reload()}}
</script></html>
