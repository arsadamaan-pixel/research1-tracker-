<!doctype html>
<html lang="si"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Research1 · Task Tracker</title>
<style>
:root{--ink:#18251f;--muted:#66736c;--line:#e1e8e3;--green:#176b4b;--pale:#edf6f0;--paper:#f6f8f5;--white:#fff}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Noto Sans Sinhala",sans-serif}header{background:#123c30;color:white;padding:30px max(22px,calc((100vw - 1000px)/2)) 26px}header h1{font-size:clamp(24px,4vw,34px);margin:0 0 4px}header p{margin:0;color:#c8ddd1}main{max-width:1000px;margin:24px auto;padding:0 20px}.progress{background:white;border:1px solid var(--line);border-radius:14px;padding:18px 20px;margin-bottom:18px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.count{font-weight:700;color:var(--green)}.bar{height:9px;background:#e8eee9;border-radius:9px;margin-top:12px;overflow:hidden}.fill{height:100%;background:#318461;width:0;transition:width .2s}.phase{margin:24px 0 10px;display:flex;align-items:baseline;gap:10px}.phase h2{font-size:19px;margin:0}.phase small{color:var(--muted)}.card{background:white;border:1px solid var(--line);border-radius:12px;margin:9px 0;overflow:hidden}.head{display:flex;align-items:center;gap:13px;padding:15px 17px;cursor:pointer}.check{width:23px;height:23px;accent-color:var(--green);flex:none}.title{font-weight:680;flex:1}.mark{font-size:12px;color:var(--green);background:var(--pale);padding:3px 9px;border-radius:20px}.detail{border-top:1px solid var(--line);padding:15px 18px 18px 54px;color:#34443b}.detail ul{padding-left:20px;margin:5px 0 15px}.detail li{margin:5px 0}.detail h3{font-size:14px;margin:13px 0 6px}.log{display:grid;grid-template-columns:1fr 1fr;gap:8px}.log textarea{border:1px solid var(--line);border-radius:8px;padding:9px;font:inherit;min-height:68px;resize:vertical}.log button,.clear{border:0;border-radius:8px;background:var(--green);color:white;padding:9px 13px;font:inherit;cursor:pointer}.saved{font-size:13px;color:var(--green);align-self:center}.hint{font-size:13px;color:var(--muted);margin:16px 2px}footer{color:var(--muted);font-size:13px;margin:26px 0}.next{color:var(--green);font-weight:650}.hidden{display:none}@media(max-width:600px){.head{padding:13px}.detail{padding:13px 14px}.log{grid-template-columns:1fr}.mark{font-size:11px}}
</style>
<header><h1>Research1 · මගේ Research වැඩසටහන</h1><p>එක් වැඩක් බැගින් සම්පූර්ණ කරලා tick කරන්න. ඔබේ සටහන් මේ browser එකේම සුරැකේ.</p></header>
<main><section class="progress"><div class="row"><strong>සමස්ත ප්‍රගතිය</strong><span class="count" id="count">0 / 12</span></div><div class="bar"><div class="fill" id="fill"></div></div><div class="next" id="next"></div></section><div id="tasks"></div><button class="clear" id="clear">සියලු tick සහ සටහන් මකන්න</button><p class="hint">ඔබේ progress එක මෙම browser එකේ local storage තුළ තබා ඇත. Browser data මැකුවහොත් සටහන් නැති වෙයි.</p><footer>Proposal 20% · Midpoint 20% · Final Dissertation 60%</footer></main>
<script>
const phases=[{"name":"යෝජනාව","weight":"20%","tasks":[[1,"මාතෘකාව සහ ගැටලුව තෝරන්න","ගැටලුව එක වාක්‍යයකින් ලියන්න.","","හැඳින්වීම වචන 200"],[2,"පෙර පර්යේෂණ සසඳන්න","විසඳී නැති ගැටලුව හඳුනාගන්න.","","වචන 500–600"],[3,"ප්‍රශ්නය සහ අරමුණු ලියන්න","මැනිය හැකි අරමුණු සහ සීමා ලියන්න.","","20%"],[4,"යෝජනාව භාර දෙන්න","ක්‍රමය, කාලසටහන සහ මූලාශ්‍ර එක් කරන්න.","","උපරිම වචන 1,500"]]},{"name":"මධ්‍ය වාර්තාව","weight":"20%","tasks":[[5,"ආචාරධර්ම අනුමැතිය ලබාගන්න","උපදේශකයා සමඟ අදාළ පෝරමය තෝරන්න.","","20%"],[6,"මධ්‍ය වාර්තාව ලියන්න","හැඳින්වීම, සාහිත්‍ය සමාලෝචනය සහ ක්‍රමවේදය ලියන්න.","","20%"],[7,"මධ්‍ය වාර්තාව භාර දෙන්න","මුල් ප්‍රගතිය සහ ඉදිරි සැලැස්ම එක් කරන්න.","","20%"]]},{"name":"අවසන් වාර්තාව","weight":"60%","tasks":[[8,"පර්යේෂණය සැලසුම් කරන්න","පද්ධතිය හෝ දත්ත රැස්කිරීම සහ පරීක්ෂණ සැලසුම් කරන්න.","","60%"],[9,"ප්‍රතිඵල ලබාගන්න","පරීක්ෂණ හෝ විශ්ලේෂණය කර සාක්ෂි සටහන් කරන්න.","","60%"],[10,"අවසන් වාර්තාව ලියන්න","ප්‍රතිඵල, සීමා සහ නිගමන ලියන්න.","","60%"],[11,"වාර්තාව භාර දෙන්න","අනුමැති පිටුව, යොමු සහ රැස්වීම් සටහන් එක් කරන්න.","","60%"],[12,"ඉදිරිපත් කිරීම සූදානම් කරන්න","ක්‍රමය සහ ප්‍රතිඵල පැහැදිලි කිරීමට පුහුණු වන්න.","","60%"]]}];
const key="research1-tracker-v1";let state={};try{state=JSON.parse(localStorage.getItem(key)||"{}")}catch{};const host=document.getElementById("tasks");
for(const ph of phases){let section=document.createElement("section");section.innerHTML='<div class="phase"><h2>'+ph.name+'</h2><small>මුළු ලකුණෙන් '+ph.weight+'</small></div>';for(const [n,title,desc,stage,marks] of ph.tasks){let card=document.createElement("article");card.className="card";let k="t"+n;let d=state[k]||{};card.innerHTML='<div class="head"><input class="check" type="checkbox" '+(d.done?'checked':'')+'><span class="title">Task '+n+' · '+title+'</span><span class="mark">'+marks.split(/[;·]/)[0]+'</span></div><div class="detail hidden"><div>'+desc+'</div><h3>වැඩ සටහන</h3><div class="log"><textarea placeholder="අද කළ වැඩ" data-field="work"></textarea><textarea placeholder="ඊළඟ වැඩ සහ ගැටලු" data-field="next"></textarea><textarea placeholder="සාක්ෂි"></textarea><span class="saved"></span></div><p><strong>ලකුණු සහ අවශ්‍යතා</strong> '+marks+'</p></div>';let head=card.querySelector(".head");head.addEventListener("click",e=>{if(e.target.type!=="checkbox")card.querySelector(".detail").classList.toggle("hidden")});let inputs=card.querySelectorAll("textarea");inputs[0].value=d.work||"";inputs[1].value=d.next||"";inputs[2].value=d.evidence||"";inputs.forEach((el,i)=>el.addEventListener("input",()=>{let x=state[k]||{};x[["work","next","evidence"][i]]=el.value;state[k]=x;localStorage.setItem(key,JSON.stringify(state));card.querySelector(".saved").textContent="සුරැකුණා"}));card.querySelector("input").addEventListener("change",e=>{let x=state[k]||{};x.done=e.target.checked;state[k]=x;localStorage.setItem(key,JSON.stringify(state));update()});section.append(card)}host.append(section)}
function update(){let n=phases.flatMap(x=>x.tasks).filter(([n])=>state["t"+n]?.done).length;document.getElementById("count").textContent=n+" / 12";document.getElementById("fill").style.width=(n/12*100)+"%";let todo=phases.flatMap(x=>x.tasks).find(([i])=>!state["t"+i]?.done);document.getElementById("next").textContent=todo?"ඊළඟ වැඩේ Task "+todo[0]+" · "+todo[1]:"සියලු වැඩ අවසන් 🎉"}update();document.getElementById("clear").onclick=()=>{if(confirm("සලකුණු සහ සටහන් මකන්නද")){localStorage.removeItem(key);location.reload()}}
</script></html>
